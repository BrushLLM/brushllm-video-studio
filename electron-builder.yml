appId: dev.brushllm.videostudio
productName: BrushLLM Video Studio
directories:
  output: release
  buildResources: build
icon: build/icon.png
files:
  - electron/**/*
  - shared/**/*
  - dist/**/*
  - staging/**/*
  - package.json
asarUnpack:
  - staging/**
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - dmg
  darkModeSupport: false
  extendInfo:
    NSMicrophoneUsageDescription: This app does not access the microphone.
    NSCameraUsageDescription: This app does not access the camera.
dmg:
  title: BrushLLM Video Studio ${version}
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: BrushLLM Video Studio-${version}-${arch}.${ext}
nsis:
  # Assisted installer whose FIRST page is the language selector
  # (requirement: language choice on install page 1).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  multiLanguageInstaller: true
