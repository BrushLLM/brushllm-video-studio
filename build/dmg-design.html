<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* DMG background: 660x420 — only text + arrow; icons are real (Finder) */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 660px; height: 420px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #ffffff;
    -webkit-font-smoothing: antialiased;
    position: relative;
    user-select: none;
  }
  .title {
    position: absolute; top: 72px; left: 0; right: 0;
    text-align: center; font-size: 32px; font-weight: 700;
    letter-spacing: -0.4px; color: #1a1b25;
  }
  .subtitle {
    position: absolute; top: 120px; left: 0; right: 0;
    text-align: center; font-size: 15px; font-weight: 500; color: #8a8ca0;
  }
  .arrow {
    position: absolute; left: 265px; top: 218px; width: 130px; height: 56px;
  }
  .drag-text {
    position: absolute; left: 180px; top: 290px; width: 300px;
    text-align: center; font-size: 13px; line-height: 1.5;
    color: #565870; font-weight: 500;
  }
  .divider {
    position: absolute; top: 356px; left: 100px; right: 100px; height: 1px;
    background: rgba(26, 27, 37, 0.08);
  }
  .help {
    position: absolute; top: 376px; left: 0; right: 0;
    text-align: center; font-size: 11px; color: #8a8ca0;
  }
</style>
</head>
<body>
  <div class="title">BrushLLM Video Studio</div>
  <div class="subtitle">macOS</div>

  <svg class="arrow" viewBox="0 0 130 56" fill="none">
    <line x1="4" y1="28" x2="108" y2="28" stroke="#893ced" stroke-width="4" stroke-linecap="round"/>
    <path d="M94 10 L118 28 L94 46" stroke="#893ced" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>

  <div class="drag-text">Drag to Applications to continue installing</div>

  <div class="divider"></div>
  <div class="help">Need help? Visit brushllm.com</div>
</body>
</html>
