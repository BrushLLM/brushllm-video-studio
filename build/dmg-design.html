<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* DMG background: 660x420 content area.
     Only text + arrow — icons are real, rendered by Finder. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 660px; height: 420px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: #ffffff;
    -webkit-font-smoothing: antialiased;
    position: relative;
    user-select: none;
  }
  .title {
    position: absolute; top: 56px; left: 0; right: 0;
    text-align: center; font-size: 34px; font-weight: 700;
    letter-spacing: -0.4px; color: #1d1d1f;
  }
  .subtitle {
    position: absolute; top: 108px; left: 0; right: 0;
    text-align: center; font-size: 15px; font-weight: 400; color: #86868b;
  }
  /* arrow between icon slots (icons at x≈180 and x≈480, y≈220) */
  .arrow {
    position: absolute; left: 255px; top: 196px; width: 150px; height: 48px;
  }
  .drag-text {
    position: absolute; left: 0; right: 0; top: 300px;
    text-align: center; font-size: 13px; font-weight: 500;
    color: #3a3a3c; letter-spacing: 0.1px;
  }
  .divider {
    position: absolute; top: 366px; left: 90px; right: 90px; height: 1px;
    background: rgba(0, 0, 0, 0.08);
  }
  .help {
    position: absolute; top: 384px; left: 0; right: 0;
    text-align: center; font-size: 11px; color: #86868b;
  }
</style>
</head>
<body>
  <div class="title">BrushLLM Video Studio</div>
  <div class="subtitle">macOS</div>

  <svg class="arrow" viewBox="0 0 150 48" fill="none">
    <line x1="4" y1="24" x2="124" y2="24" stroke="#1d1d1f" stroke-width="5" stroke-linecap="round"/>
    <path d="M110 6 L134 24 L110 42" stroke="#1d1d1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>

  <div class="drag-text">Drag to Applications to install</div>

  <div class="divider"></div>
  <div class="help">Need help? Visit brushllm.com</div>
</body>
</html>
