name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch pinned media engine (SHA-256 verified)
        run: node scripts/fetch-binaries.mjs --platform darwin-arm64
      - name: Unit + end-to-end tests (real FFmpeg)
        run: npm test
      - run: npm run dist:mac-arm64
      - name: Smoke-test the packaged media engine
        run: node scripts/smoke-packaged.mjs "release/mac-arm64-build/mac-arm64/BrushLLM Video Studio.app/Contents/MacOS/BrushLLM Video Studio"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            release/mac-arm64-build/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch pinned media engine (SHA-256 verified)
        run: node scripts/fetch-binaries.mjs --platform win32-x64,win32-arm64
        shell: bash
      - name: Unit + end-to-end tests (real FFmpeg, Windows paths)
        run: npm test
        shell: bash
      - run: npm run dist:win-x64
        shell: bash
      - name: Smoke-test the packaged x64 media engine
        run: node scripts/smoke-packaged.mjs "release/win-x64-build/win-unpacked/BrushLLM Video Studio.exe"
        shell: bash
      - run: npm run dist:win-arm64
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/win-x64-build/*.exe
            release/win-arm64-build/*.exe
          if-no-files-found: error

  release:
    needs: [mac-arm64, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          test -s "docs/releases/$GITHUB_REF_NAME.md"
          shopt -s globstar nullglob
          installers=(artifacts/**/*.dmg artifacts/**/*.exe)
          test "${#installers[@]}" -eq 3
          mkdir -p out
          for installer in "${installers[@]}"; do
            name="${installer##*/}"
            cp "$installer" "out/${name// /.}"
          done
          cd out
          stem="BrushLLM.Video.Studio-$version"
          sha256sum "$stem-arm64.dmg" "$stem-x64.exe" "$stem-arm64.exe" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
