name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: New release tag from main. Leave blank to build installers only.
        type: string
      reuse_build_run:
        description: Run ID with successful macOS and Windows builds for this source. Optional.
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify the release target
        id: target
        env:
          REQUESTED_TAG: ${{ inputs.publish_tag }}
          BUILD_RUN_ID: ${{ inputs.reuse_build_run }}
        shell: bash
        run: |
          version="$(jq -er '.version' package.json)"
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ -z "$REQUESTED_TAG" ]]; then
              if [[ -n "$BUILD_RUN_ID" ]]; then
                echo "::error::Reusing a build requires a release tag"
                exit 1
              fi
              exit 0
            fi
            if [[ "$GITHUB_REF" != refs/heads/main || "$REQUESTED_TAG" != "$tag" ]]; then
              echo "::error::Select main and use the tag that matches package.json ($tag)"
              exit 1
            fi
            existing_tag="$(git ls-remote --refs origin "refs/tags/$tag")"
            if [[ -n "$existing_tag" ]]; then
              echo "::error::Release tag $tag already exists"
              exit 1
            fi
          elif [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::The pushed tag must match package.json ($tag)"
            exit 1
          fi
          test -s "docs/releases/$tag.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify the existing build and source
        if: inputs.reuse_build_run != ''
        env:
          BUILD_RUN_ID: ${{ inputs.reuse_build_run }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Enter a numeric build run ID"
            exit 1
          fi
          run_api="repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID"
          build_sha="$(gh api "$run_api" --jq '
            select(.status == "completed" and .path == ".github/workflows/build.yml") | .head_sha
          ')"
          if [[ ! "$build_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The run must be a completed Video Studio build"
            exit 1
          fi
          jobs="$(gh api "$run_api/jobs?filter=latest" --jq '[.jobs[] | select(.conclusion == "success") | .name]')"
          if ! jq -e 'index("mac-arm64") != null and index("windows") != null' <<< "$jobs"; then
            echo "::error::Both packaging jobs must have succeeded"
            exit 1
          fi
          git fetch --no-tags origin "$build_sha"
          if ! git diff --quiet "$build_sha" "$GITHUB_SHA" -- . ':(exclude).github/workflows/build.yml'; then
            echo "::error::The build run must use the same application source and release notes"
            exit 1
          fi

  mac-arm64:
    needs: prepare
    if: inputs.reuse_build_run == ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch pinned media engine (SHA-256 verified)
        run: node scripts/fetch-binaries.mjs --platform darwin-arm64
      - name: Unit + end-to-end tests (real FFmpeg)
        run: npm test
      - run: npm run dist:mac-arm64
      - name: Smoke-test the packaged media engine
        run: node scripts/smoke-packaged.mjs "release/mac-arm64-build/mac-arm64/BrushLLM Video Studio.app/Contents/MacOS/BrushLLM Video Studio"
      - uses: actions/upload-artifact@v6
        with:
          name: mac-arm64
          path: |
            release/mac-arm64-build/*.dmg
          if-no-files-found: error

  windows:
    needs: prepare
    if: inputs.reuse_build_run == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch pinned media engine (SHA-256 verified)
        run: node scripts/fetch-binaries.mjs --platform win32-x64,win32-arm64
        shell: bash
      - name: Unit + end-to-end tests (real FFmpeg, Windows paths)
        run: npm test
        shell: bash
      - run: npm run dist:win-x64
        shell: bash
      - name: Smoke-test the packaged x64 media engine
        run: node scripts/smoke-packaged.mjs "release/win-x64-build/win-unpacked/BrushLLM Video Studio.exe"
        shell: bash
      - run: npm run dist:win-arm64
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            release/win-x64-build/*.exe
            release/win-arm64-build/*.exe
          if-no-files-found: error

  release:
    needs: [prepare, mac-arm64, windows]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.tag != '' &&
          (inputs.reuse_build_run != '' || (needs.mac-arm64.result == 'success' && needs.windows.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: video-studio-release-${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
      - name: Verify installers and generate SHA256SUMS
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          stem="BrushLLM Video Studio-${TAG#v}"
          mkdir -p out
          for suffix in arm64.dmg x64.exe arm64.exe; do
            name="$stem-$suffix"
            installer="$(find artifacts -type f -name "$name" -print)"
            if [[ ! -s "$installer" ]]; then
              echo "::error::Expected exactly one nonempty installer named $name"
              exit 1
            fi
            cp "$installer" "out/${name// /.}"
          done
          cd out
          stem="${stem// /.}"
          sha256sum "$stem-arm64.dmg" "$stem-x64.exe" "$stem-arm64.exe" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create and verify the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field "ref=refs/tags/$TAG" --raw-field "sha=$GITHUB_SHA" --silent
          fi
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: out/*
          body_path: docs/releases/${{ needs.prepare.outputs.tag }}.md
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
