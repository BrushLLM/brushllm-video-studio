name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch pinned media engine (SHA-256 verified)
        run: node scripts/fetch-binaries.mjs
      - run: npm run dist:mac-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            release/mac-arm64-build/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch pinned media engine (SHA-256 verified)
        run: node scripts/fetch-binaries.mjs
        shell: bash
      - run: npm run dist:win-x64
        shell: bash
      - run: npm run dist:win-arm64
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/win-x64-build/*.exe
            release/win-arm64-build/*.exe
          if-no-files-found: error

  release:
    needs: [mac-arm64, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -name "*.dmg" -o -name "*.exe" | xargs -I{} cp {} out/
          ls -la out/
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
